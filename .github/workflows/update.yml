name: Update data
on:
  schedule:
    - cron: '17 9 3 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/firms.json'
      - 'scripts/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Look up office counties
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/build.py geocode
      - name: Pull county crash records
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/build.py fars
      - name: Build dataset and reports
        run: python -u scripts/build.py firms
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update firm dataset and county reports"
            git push
          fi
